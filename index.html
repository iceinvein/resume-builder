    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Resume Builder",
        "url": "https://resume-mdx.netlify.app/",
        "description": "Write a resume in MDX, preview it live, and export a typeset PDF. Runs entirely in your browser, drafts save locally, no account required.",

        "applicationSubCategory": "Resume Builder",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript and WebAssembly.",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Write resumes in MDX with a small fixed JSX dialect",
          "Live SVG preview rendered by Typst (WASM) in a Web Worker",
          "Export typeset PDF entirely client-side",
          "Structured form editor and CodeMirror 6 MDX editor",
          "Drafts persist locally to IndexedDB, no server",

  <body>
    <div id="root"></div>
    <noscript>
      <main style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6;">
        <h1>Resume Builder</h1>
        <p>
          Resume Builder is a browser tool for writing resumes in MDX and exporting
          typeset PDFs. It runs entirely client-side, so JavaScript and WebAssembly
          must be enabled to use it.
        </p>
        <p>
          Features include a structured form editor, an MDX editor with live preview,
          local-only IndexedDB autosave, and one-click PDF export rendered by Typst.
        </p>
        <p>
          The MDX dialect and the underlying JSON schema are documented in the
          project's README.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/index.tsx"></script>
